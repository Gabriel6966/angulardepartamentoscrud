<h1>Departamentos</h1>
<table class="table table-striped">

    <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Localidad</th>
        </tr>
    </thead>
    <tbody>
        @for(departamento of ArrayDepartamentos;track departamento){
            <tr>
                <td>{{departamento.numero}}</td>
                <td>{{departamento.nombre}}</td>
                <td>{{departamento.localidad}}</td>
                <td>
                    <a [routerLink] ="['/details/' + departamento.numero + '/' + departamento.nombre + '/' + departamento.localidad]">Details</a>
                </td>
                <td>
                    <a [routerLink] ="['/update/' + departamento.numero + '/' + departamento.nombre + '/' + departamento.localidad]">Update</a>
                </td>
                <td>
                    <button class="btn btn-danger" (click)="deleteDepartamento(departamento.numero)">
                        Delete
                    </button>
                </td>
            </tr>
        }
    </tbody>

</table>
